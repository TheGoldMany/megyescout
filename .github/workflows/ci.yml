name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL tests (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: etl } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: etl/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (seeded Postgres + Playwright)
    runs-on: ubuntu-latest
    needs: [etl, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: hunscout, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hunscout" --health-interval 5s --health-retries 10
    env:
      # the web app uses the least-privilege role from migration 003 so RLS is exercised too
      DATABASE_URL: postgresql://hunscout_web:hunscout_web@localhost:5432/hunscout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: etl/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Migrate + seed demo data
        working-directory: etl
        env: { DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/hunscout" }
        run: |
          pip install -r requirements.txt
          python cli.py seed --reset
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: web/test-results, retention-days: 7 }
